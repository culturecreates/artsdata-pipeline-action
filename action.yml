name: 'Custom Artsdata Pipeline Action'
description: 'A custom action for the Artsdata pipeline'

inputs:
  mode: 
    description: 'Mode of the action(fetch/push/fetch-push)'
    required: true
    default: 'push'
  page-url:
    description: 'URL(s) of the page(s) to crawl. Provide a single URL or a comma-separated list, e.g. "https://a.com,https://b.com"'
  entity-identifier:
    description: 'Identifiers of the entity to fetch'
  artifact-file:
    description: 'Local file path (with extension) used to save fetched data and to read data when pushing. Preferred over the deprecated "downloadFile". If not provided, defaults to output/[artifact].jsonld'
  downloadFile:
    description: 'DEPRECATED: use "artifact-file" instead. Local file path (with extension) for the artifact.'
  downloadUrl:
    description: 'Remote URL of the file to register on the Databus. Defaults to the raw path of "artifact-file" in the current repo.'
  is-paginated:
    description: 'Whether the page is paginated'
    default: 'false'
  headless:
    description: 'Whether to run in headless mode'
    default: 'false'
  artifact:
    description: 'Name of the artifact'
  token:
    description: 'GitHub token'
  publisher:
    description: 'URI of the publisher'
  comment:
    description: 'Comment'
  group:
    description: 'Group of artifacts/versions. Typically the name of the tool creating the artifact. Use unreserved characters.'
  version:
    description: 'Version of the artifact. Usually a date. For example: 2020-10-23. Use unreserved characters.'
  report-callback-url:
    description: 'URL to send back the data validation report asynchronously using POST "Content-Type: application/json"'
  shacl:
    description: 'URL to the SHACL file'
  fetch-urls-headlessly:
    description: 'Set as true to fetch the entity URLs headlessly'
  offset:
    description: 'Offset for paginated pages'
  custom-user-agent:
    description: 'Custom user agent string'
  custom-databus-url:
    description: 'Custom Databus URL'
    default: 'http://api.artsdata.ca/databus/'
  html-extract-config:
    description: 'Custom HTML configuration as JSON'
  metadata-config:
    description: 'metadata for spider as JSON'
  register-only:
    description: 'If true, upload to databus in register-only mode'
    default: 'false'
  custom-sparql:
    description: 'URL to a repo-specific SPARQL transformation applied per entity during fetch. Use "domain_name" as the placeholder for the base URL.'
    required: false
  urls-are-entities:
    description: 'Set true when page-url is a comma-separated list of already-resolved entity page URLs. Skips spidering and single-selector fetching, and fetches each URL directly.'
    default: 'false'
    required: false
  cloudflare-private-key:
    description: 'Ed25519 private key for Cloudflare signing (PEM format content)'
    required: false

runs: 
  using: 'composite'
  steps:

    - name: Run
      id: run
      run: |

        cat <<EOF > config.yml
        mode: ${{ inputs.mode }}
        page_url: ${{ inputs.page-url }}
        entity_identifier: ${{ inputs.entity-identifier }}
        is_paginated: ${{ inputs.is-paginated }}
        headless: ${{ inputs.headless }}
        fetch_urls_headlessly: ${{ inputs.fetch-urls-headlessly }}
        offset: ${{ inputs.offset || '1' }}
        custom_user_agent: ${{ inputs.custom-user-agent || ''}}
        callback_url: ${{ inputs.report-callback-url || '' }}
        workflow_id: ${{ github.workflow }}
        actor: ${{ github.actor }}
        token: ${{ inputs.token }}
        repository: ${{ github.repository }}
        artifact: ${{ inputs.artifact }}
        publisher: ${{ inputs.publisher }}
        reference: ${{ github.ref }}
        version: ${{ inputs.version }}
        comment: ${{ inputs.comment || format('https://github.com/{0}/blob/{1}/{2}', github.repository, github.ref_name, github.event.workflow) }}
        group: ${{ inputs.group }}
        download_file: ${{ inputs.artifact-file || inputs.downloadFile }}
        download_url: ${{ inputs.downloadUrl }}
        shacl: ${{ inputs.shacl }}
        databus: ${{ inputs.custom-databus-url }}
        register_only: ${{ inputs.register-only }}
        custom_sparql: ${{ inputs.custom-sparql }}
        urls_are_entities: ${{ inputs.urls-are-entities }}
        cloudflare_private_key: |
        $(printf "%s" "${{ inputs.cloudflare-private-key  }}" | sed 's/^/ /')
        EOF
        
        cat config.yml
                
        cat <<EOF > html-extract-config.json
          ${{ inputs.html-extract-config }}
        EOF

        cat <<EOF > metadata-file.json
          ${{ inputs.metadata-config }}
        EOF

        mkdir -p output
        mkdir -p metadata

        version="v4.0.8"

        for i in {1..5}; do
          docker pull ghcr.io/culturecreates/artsdata-pipeline-action/artsdata-rdf-fetcher:$version && break
          echo "Retry $i/5..."
          sleep 10
        done

        # --- reporting change starts here ---
        # Default shell runs with `set -eo pipefail`, which would exit this
        # step immediately on a nonzero docker exit code, before we get a
        # chance to classify and upload a result. Disable that locally,
        # capture the real exit code ourselves, and restore it at the end
        # so the job's overall pass/fail status is unchanged.
        set +e
        started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        docker run --shm-size=1g \
          -v $(pwd)/config.yml:/usr/src/app/config.yml:ro \
          -v $(pwd)/html-extract-config.json:/usr/src/app/html-extract-config.json:ro \
          -v $(pwd)/metadata-file.json:/usr/src/app/metadata-file.json:ro \
          -v $(pwd)/metadata:/usr/src/app/metadata \
          -v $(pwd)/output:/usr/src/app/output \
          ghcr.io/culturecreates/artsdata-pipeline-action/artsdata-rdf-fetcher:$version \
          /usr/src/app/config.yml \
          /usr/src/app/html-extract-config.json \
          /usr/src/app/metadata-file.json \
          2>&1 | tee run.log

        exit_code=${PIPESTATUS[0]}
        ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
        echo "ended_at=$ended_at" >> "$GITHUB_OUTPUT"
        set -e
        # --- reporting change ends here ---

      shell: bash

    - name: Classify and write result.json
      if: always() && steps.run.outputs.exit_code != '0'
      shell: bash
      run: |
        ruby "${{ github.action_path }}/write_result.rb" \
          "${{ steps.run.outputs.exit_code }}" \
          "${{ steps.run.outputs.started_at }}" \
          "${{ steps.run.outputs.ended_at }}"

    - name: Upload result artifact
      if: always() && steps.run.outputs.exit_code != '0'
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: result.json
        retention-days: 90

    - name: Preserve original exit code
      if: always() && steps.run.outputs.exit_code != '0'
      shell: bash
      run: exit ${{ steps.run.outputs.exit_code }}